name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static checks and tests
        # The very first commits have no package.json yet; there is nothing to check until it exists.
        run: |
          if [ -f package.json ]; then
            npm run check
            npm test
          else
            echo "No package.json yet, nothing to check"
          fi
